<text x="217.0000" y="280.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#ac5b27" text-anchor="middle">Equipo pileta P</text>
<line x1="232.0000" y1="255.0000" x2="236.0000" y2="255.0000" stroke="#236a86" stroke-width="0.2" stroke-dasharray="2 1"/>
<text x="302.0000" y="52.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">AGUA / DESAGUE / PLUVIAL</text>
<text x="302.0000" y="59.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">AF-1 cocina mono; B-1 bano mono; Q-1 quincho; B-3 bano pileta; B-2 bano PA; C-2 cocina PA. Nodos sobre equipos reales del modelo.</text>
<text x="302.0000" y="66.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Las lineas punteadas son relaciones funcionales, no tuberias ejecutivas. Recorridos, diametros, pendientes, ventilaciones, registros y acometidas se definen con el proyecto sanitario.</text>
<text x="302.0000" y="73.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Pluvial: captacion y bajadas en A04. Destino final de descarga propuesto; red y cota de conexion exactas pendientes.</text>
<text x="302.0000" y="81.2000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Pileta P: skimmer / toma de fondo -&gt; prefiltro / bomba -&gt; filtro -&gt; retornos. Prever valvulas, vaciado, renovacion y medidas de seguridad; equipo y tuberias por calcular.</text>
<text x="302.0000" y="200.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">ELECTRICIDAD / ILUMINACION / EXTRACCION</text>
<text x="302.0000" y="207.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Servicios de red disponibles segun propietario. Tablero y medidor propuestos junto al acceso; ubicacion final segun prestador.</text>
<text x="302.0000" y="214.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: separar circuitos de iluminacion, tomas generales, cocinas, pileta y estudio. Definir potencias, protecciones, puesta a tierra y equipotencialidad.</text>
<text x="302.0000" y="221.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: luminarias representadas no equivalen a calculo luminotecnico ni conexion electrica.</text>
<text x="302.0000" y="229.2000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: conductos de horno, parrilla y cocina presentes. Ver A10: caudal, limpieza, aislamiento y reposicion de aire pendientes.</text>
<text x="302.0000" y="236.6000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: ventilacion sanitaria y acondicionamiento del estudio sin dimensionar. Coordinar penetraciones para mantener continuidad termica, acustica y de agua.</text>
<text x="33.0000" y="334.0000" font-family="Arial" font-size="3.1" font-weight="normal" fill="#ac5b27" text-anchor="start">CRITERIO DE COORDINACION: localizar consumos y cruces antes de dimensionar redes. Sin cotas de servicio ni calculos no se presenta este esquema como</text>
<text x="33.0000" y="339.1000" font-family="Arial" font-size="3.1" font-weight="normal" fill="#ac5b27" text-anchor="start">instalacion completa o certificada.</text>
</svg>