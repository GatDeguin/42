<text x="528.0000" y="180.9000" font-family="Arial" font-size="2.5" font-weight="normal" fill="#236a86" text-anchor="start">0,60 m</text>
<text x="36.0000" y="258.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">CAPAS Y GESTION DEL AGUA</text>
<text x="36.0000" y="265.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: cubierta metalica, aislacion representada de 80 mm, revestimiento inferior y cabios/correas. La seccion corta las piezas de la malla a su escala real.</text>
<text x="36.0000" y="272.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: chapa nominal0,8 mm. Suplemento D01 propone capas, goteron, solape150 y fijaciones selladas; compatibilidad y resistencia por verificar.</text>
<text x="36.0000" y="279.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: babeta/contrababeta del salto, retorno de membrana y sellos alrededor de conductos desarrollados en suplemento D02; verificar frente a exposicion real.</text>
<text x="36.0000" y="287.2000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: validar condensacion, viento, dilatacion y puentes termicos con datos climaticos y especificaciones definitivas.</text>
<text x="346.0000" y="303.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">DVH, UMBRALES Y BALCON</text>
<text x="346.0000" y="310.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Encuentros generales: A07, A14 y A13b. Suplemento D01-D04 desarrolla capas, solapes, sellos y anclajes con cotas en mm.</text>
<text x="346.0000" y="317.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: junta perimetral con respaldo y sello compatible; apoyo y calzos de vidrio, drenaje del marco, continuidad de aislacion e impermeabilizacion.</text>
<text x="346.0000" y="324.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">El suplemento distingue las piezas G de las propuestas P; las especificaciones finales dependen del sistema y fabricante seleccionados.</text>
</svg>