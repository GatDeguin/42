<text x="337" y="333.2" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">P acceso desmontable de300 x300 al registro del patinillo. Aislamiento y distancias a combustibles requieren seleccion del sistema de combustion.</text>
