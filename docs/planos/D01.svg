<text x="31" y="323" fill="#1c6b92" font-family="Arial" font-size="3.5" font-weight="bold" text-anchor="start">CAPAS / IDENTIFICACION</text>
<text x="31" y="330" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">1 G chapa nominal 0,8. P camara ventilada de20 sobre aislacion; necesita separadores que no aplasten la manta.</text>
<text x="31" y="337.2" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">2 G aislacion80. P membrana exterior drenante y retorno30 al goteron. 3 P continuidad de control de aire/vapor por debajo; tipo segun estudio higrotermico.</text>
<text x="323" y="292" fill="#1c6b92" font-family="Arial" font-size="3.5" font-weight="bold" text-anchor="start">DECISION DIMENSIONAL P</text>
<text x="323" y="299" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">Solape150 de remates; retorno20 de borde; sello neutro compatible; fijacion inicial cada300 en remate. No se traslada como tabla de fijacion de la chapa a correas.</text>
<text x="323" y="306.2" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">El detalle muestra orden de capas y salida del agua. Los espesores submilimetricos se dibujan con peso de linea legible, sin escalarlos como material mas grueso.</text>
<text x="323" y="367" fill="#384c55" font-family="Arial" font-size="2.5" font-weight="normal" text-anchor="start">R1 | Lysaght: Roofing &amp; Walling Installation Manual, §§7.9 y11</text>
