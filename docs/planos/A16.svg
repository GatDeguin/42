<text x="375.0000" y="55.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">FUENTES Y REVISION</text>
<text x="375.0000" y="62.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">F: source/scene.json, configuracion y geometria original. Coordenadas fuente X / Z horizontal; Y altura. Blender X / -Z / Y.</text>
<text x="375.0000" y="69.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">F: docs/DECISIONES.md: estudio 3,20 m libres, vivienda 2,60 m y video pausado.</text>
<text x="375.0000" y="76.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: modelo Casa_de_Campo_95_R6K.blend; SHA256 a3663a5081dac391303f25b8...</text>
<text x="375.0000" y="84.2000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: extraccion de mallas evaluadas a cuadro 150, con puertas en su pose de documentacion. Los detalles omiten microgeometria menor para permitir</text>
<text x="375.0000" y="88.6000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">lectura.</text>
<text x="375.0000" y="96.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: desarrollos constructivos y sistemas inferidos se identifican en sus hojas. No se presentan como verificacion profesional.</text>
<text x="375.0000" y="103.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Las superficies de piezas no son utiles netas de recintos. Comprobar uniones y areas comunes antes de sumar; los pisos PB de banos se recortaron de las</text>
<text x="375.0000" y="107.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">superficies generales.</text>
<text x="375.0000" y="279.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">PENDIENTES PARA EMISION FINAL</text>
<text x="375.0000" y="286.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Mensura y topografia; servicios y cotas exactas; suelos; calculo de estructura, instalaciones, seguridad, clima y acustica.</text>
<text x="375.0000" y="293.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Cierre de observaciones de la auditoria y coherencia con modelo / visor congelados. Umbral critico 9,5 y realismo fotografico siguen siendo condiciones de</text>
<text x="375.0000" y="297.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">entrega.</text>
<text x="24.0000" y="342.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">ARCHIVOS: un PDF multipagina vectorial A2; un SVG y un DXF por lamina; geometria.json de extraccion; manifest.json de versiones; verification.json de controles. Los DXF contienen las vistas metricas separadas y cotas; la cartela completa se conserva en</text>
<text x="24.0000" y="346.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">PDF/SVG.</text>
