<text x="458.0000" y="100.0000" font-family="Arial" font-size="2.7" font-weight="normal" fill="#236a86" text-anchor="middle">CONDUCTOS INDEPENDIENTES</text>
<text x="35.0000" y="284.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">05/A13b CAPTACION / FIJACION</text>
<text x="35.0000" y="291.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: seccion de canaleta recortada directamente de la malla. Verificar apertura superior, fondo, salida lateral y continuidad en</text>
<text x="35.0000" y="295.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">la prueba del modelo.</text>
<text x="35.0000" y="302.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: pendiente longitudinal, caudal, fijacion y sellos requieren dimensionado; el ancho grafico no certifica capacidad pluvial.</text>
<text x="227.0000" y="242.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">06/A13b ENCUENTRO DE VENTANA</text>
<text x="227.0000" y="249.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: dos paños, marco, antepecho y alféizar representados. La ampliacion permite revisar solapes y</text>
<text x="227.0000" y="253.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">contacto.</text>
<text x="227.0000" y="260.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: apoyo, sellos, drenaje del marco y conexion de aislacion desarrollados a1:5 en suplemento D03.</text>
<text x="227.0000" y="268.2000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Ver A12 para anchos, alturas y cotas de cada pieza.</text>
<text x="370.0000" y="245.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">07/A13b PENETRACION / PATINILLO</text>
<text x="370.0000" y="252.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G: conductos independientes, babetas perforadas y remate de patinillo. Se muestra la interseccion con cubierta.</text>
<text x="370.0000" y="259.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P: continuidad de membrana, cuello y contrababetas, dilataciones, aislamiento termico y acceso de limpieza por especificar.</text>
<text x="370.0000" y="266.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">No se asignan distancias reglamentarias a combustibles ni caudales sin proyecto de combustion.</text>
</svg>