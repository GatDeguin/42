<text x="389" y="229" fill="#1c6b92" font-family="Arial" font-size="3.5" font-weight="bold" text-anchor="start">SECUENCIA FUNCIONAL P</text>
<text x="389" y="236" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">Aire exterior -&gt; filtro -&gt; ventilador -&gt; silenciador -&gt; impulsion. Retorno -&gt; silenciador -&gt; expulsion. Mantener ambos circuitos diferenciados.</text>
<text x="389" y="243.2" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">Reserva de cajas en plenum: X18,30..20,50; Z2,80..4,30; +6,68..+7,08. No ocupa la altura libre3,20; comprobar soportes y accesos antes</text>
<text x="389" y="247.39999999999998" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">del modelado.</text>
<text x="389" y="254.59999999999997" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">Ductos inicialesØ200, rejillas600 x150 y mangas flexibles100. Secciones P para coordinacion; velocidad, presion, caudal, ruido y</text>
<text x="389" y="258.79999999999995" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">condensados se dimensionan con ocupacion y equipo.</text>
<text x="389" y="265.99999999999994" fill="#384c55" font-family="Arial" font-size="2.8" font-weight="normal" text-anchor="start">Tomas exteriores y expulsion deben separarse de combustion y entre si; terminales y distancias finales necesitan la seleccion del sistema.</text>
