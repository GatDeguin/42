<text x="330.0000" y="103.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">F - Fuente: cotas expresas del HTML original y decisiones del propietario.</text>
<text x="330.0000" y="110.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">G - Geometria: medida derivada de la version Blender identificada por SHA256. No equivale a un relevamiento de obra.</text>
<text x="330.0000" y="117.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">P - Propuesta: coordinacion o solucion grafica inferida. Validar antes de construir.</text>
<text x="330.0000" y="125.2000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Niveles referidos al cero del modelo. No hay relevamiento altimetrico ni mensura catastral.</text>
<text x="330.0000" y="132.6000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Ubicacion: Virrey del Pino, Partido de La Matanza, Buenos Aires. Norte orientativo segun propietario: con la calle arriba, abajo a la izquierda.</text>
<text x="330.0000" y="140.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Servicios de red disponibles segun propietario. Posiciones, cotas y condiciones exactas de acometida pendientes.</text>
<text x="330.0000" y="147.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Escalas fisicas para impresion al 100 %. DXF en metros; cada vista se separa horizontalmente en espacio modelo.</text>
<text x="330.0000" y="286.0000" font-family="Arial" font-size="3.7" font-weight="bold" fill="#236a86" text-anchor="start">JERARQUIA GRAFICA</text>
<text x="330.0000" y="293.0000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">0,50 mm: contorno de piezas cortadas. Relleno gris: material seccionado.</text>
<text x="330.0000" y="300.4000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">0,18 / 0,13 mm: proyecciones, mobiliario y contexto.</text>
<text x="330.0000" y="307.8000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">Azul: cotas, niveles, referencias y criterios de coordinacion.</text>
<text x="330.0000" y="315.2000" font-family="Arial" font-size="2.8" font-weight="normal" fill="#172b35" text-anchor="start">No constituye proyecto ejecutivo ni calculo estructural, sanitario, electrico o acustico.</text>
